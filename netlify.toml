# Netlify deployment configuration
# The site is plain HTML + CSS + JavaScript — there is no build step.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false
  [build.processing.html]
    minify = true
  [build.processing.css]
    minify = true
  [build.processing.js]
    minify = true
  [build.processing.images]
    optimize_images = true

# Long-lived caching for the versioned assets in /assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Serve index.html for unknown paths (static files still win)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
